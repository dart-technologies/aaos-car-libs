// Library-level build file

apply plugin: 'com.android.library'

android {
    namespace = 'com.android.car.apps.common'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        // Dart fork note: upstream's tests/unittests were wired only into Soong; they run here.
        test {
            java.srcDirs = ['tests/unittests/src']
            resources.srcDirs = ['tests/unittests/config']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = false
        }
    }

    // This is the gradle equivalent of the libs: ["android.car"] in the Android.bp
    useLibrary 'android.car'
}

dependencies {

    // Dart fork note: Gradle equivalents of those tests' Android.bp dependencies. Robolectric
    // because both classes touch LiveData and Looper.
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockito.core
    testImplementation libs.truth
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.androidx.arch.core.testing
    testImplementation project(':car-apps-common-testutils')

    implementation libs.androidx.annotation
    implementation libs.androidx.cardview
    implementation libs.androidx.interpolator

    implementation libs.androidx.lifecycle.common.java8
    // Dart fork note: lifecycle-extensions (final release 2.2.0) was removed; nothing used it. It
    // was the only compile-scope supplier of lifecycle-livedata, now declared. `api`, because
    // LiveData appears in public signatures (docs/api-surface/car-apps-common.txt).
    api libs.androidx.lifecycle.livedata
    // androidx.fragment was never declared ANYWHERE in this repository. FragmentUtils uses Fragment
    // and FragmentActivity directly; 1.5.4 is what already resolves here, via appcompat.
    api libs.androidx.fragment

    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview

    // Dart fork note: upstream shipped junit on the production runtime classpath; the test helpers
    // that needed it moved to :car-apps-common-testutils.

    implementation project(":car-ui-lib")
}
