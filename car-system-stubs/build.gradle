// Dart fork addition — not present upstream.
//
// Minimal compile-time stand-in for the @SystemApi classes that AOSP's
// android.car-system-stubs.jar provides and the public android.car.jar does
// not. Consumed compileOnly, so nothing here is ever packaged. See
// FORK.md.

apply plugin: 'com.android.library'

android {
    namespace = 'dev.dart.aaos.carsystemstubs'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
    }
}
