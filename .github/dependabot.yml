version: 2
updates:
  # Dependabot bumps both the SHA pin and its trailing # vX comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Yank window: with auto-merge on, wait out bad releases. Security updates
    # bypass cooldown; version updates wait 7 days (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      # One PR for all action minors/patches; auto-merged on green CI. Majors stay separate.
      minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    # Every version is in gradle/libs.versions.toml under this directory, which Dependabot reads.
    directory: /aaos-apps-gradle-project
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Yank window: with auto-merge on, wait out bad releases. Security updates
    # bypass cooldown; version updates wait 7 days (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps'
    groups:
      androidx-test:
        patterns:
          - 'androidx.test*'
      # One PR for all library minors/patches; auto-merged on green CI. Majors (AGP,
      # Gradle, mockito-legacy 2.x) stay separate and manual.
      minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # The plugin ABI version is a compatibility decision against what ships on head units
      # (FORK.md), not an automatic update.
      - dependency-name: 'com.android.car.ui:car-ui-lib-plugin-apis'
      # Pinned at 2.28.1: 2.28.6 + Mockito 5 aborts ART in LocationImpl.stackWalk
      # (car-ui-lib androidTest). Revisit only with an instrumented run in hand.
      - dependency-name: 'com.linkedin.dexmaker:dexmaker-mockito-inline'
      # 4.17 breaks every Robolectric suite on the CI JDK (FileDescriptorInterceptor
      # "Failed to interact with raw FileDescriptor internals" in ApplicationSharedMemory).
      # Revisit with a JDK bump, not alone.
      - dependency-name: 'org.robolectric:robolectric'
