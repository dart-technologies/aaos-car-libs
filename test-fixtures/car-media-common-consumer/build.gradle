apply plugin: 'com.android.library'

android {
    namespace = 'art.dart.fixtures.carmediaconsumer'
    compileSdk = gradle.ext.aaosLatestSDK
    defaultConfig { minSdk = 30 }
}

dependencies {
    // Deliberately the only dependency. Direct Media3 or Guava declarations would invalidate the
    // fixture by hiding a missing `api` edge in car-media-common.
    implementation project(':car-media-common')
}
