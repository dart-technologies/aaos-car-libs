// Library-level build file

apply plugin: 'com.android.library'
// Dart fork note: upstream also applied the standalone 'jacoco' plugin, which conflicts with
// AGP's own JaCoCo wiring and breaks :testDebugUnitTest. See enableAndroidTestCoverage below.

android {
    namespace = 'com.android.car.ui'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs = [
                    'src/main/res',
                    'src/main/res-private'
                    // NOTE: 'src/main/res-overlayable' is deliberately NOT listed, and that means
                    // this module's 604-item <overlayable> surface — the documented OEM seam — is
                    // absent from every artifact this Gradle project builds. Verified with
                    // `aapt2 dump overlayable` against PaintBooth's APK: nothing.
                    //
                    // Adding it fails the build. That directory also holds removed_resources.xml,
                    // a bookkeeping file listing resources DELETED from the overlayable so RROs do
                    // not target them; AGP compiles its <item> entries as real resource
                    // definitions and they collide with res-private
                    // (layout/car_ui_base_layout_toolbar_legacy). Upstream builds this with Soong,
                    // which does not have that problem.
                    //
                    // Left as-is on purpose: making it work means either restructuring vendored
                    // upstream resources or splitting the directory, and both are decisions about
                    // library behaviour rather than build plumbing. Recorded in
                    // docs/ARCHITECTURE.md so it is a known gap rather than an assumed seam.
            ]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Dart fork note: stub android.jar methods throw; defaults let JVM tests run real logic.
            returnDefaultValues = true
        }
        animationsDisabled = true
    }

    buildTypes {
        debug {
            // Dart fork note: replaces testCoverageEnabled, deprecated in AGP 8.
            enableAndroidTestCoverage = true
        }
    }

    project.gradle.taskGraph.whenReady {
        connectedDebugAndroidTest {
            ignoreFailures = true
        }
    }

    buildFeatures {
        buildConfig = false
    }

    // This is the gradle equivalent of the libs: ["android.car"] in the Android.bp
    useLibrary 'android.car'

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
}

dependencies {
    // The plugin contract, from the PUBLISHED artifact rather than a vendored copy.
    //
    // The copy that lived at :oem-apis was measured to be published 1.0.1 minus nine methods on
    // RecyclerViewOEMV1, with LayoutStyleOEMV1.getSpanSize weakened from abstract to default — a
    // divergence that produced an AbstractMethodError against a stock AAOS image and cost hours to
    // diagnose. Parity was restored by hand first (996170b60); depending on the artifact is what
    // makes it an invariant rather than a fact someone measured once.
    //
    // Still compileOnly: at runtime these interfaces come from whichever copy the host app loaded.
    compileOnly libs.carui.plugin.apis
    api project(':car-rotary-lib')
    api libs.androidx.annotation
    api libs.androidx.appcompat
    api libs.androidx.constraintlayout
    api libs.androidx.preference
    api libs.androidx.recyclerview
    api libs.androidx.core
    api libs.androidx.asynclayoutinflater
    // Seven files here use Fragment/DialogFragment directly, but it was never declared: it came in
    // through appcompat at 1.5.4. Declared with the fragment bump, so this module compiles against
    // the version car-apps-common and car-media-common ship next to it.
    api libs.androidx.fragment

    // Dart fork note: a local JVM test source set for the UX-restriction state machine (upstream
    // had only instrumented tests). Mockito 5's inline mock maker mocks final android.car classes.
    // Dart fork addition: the plugin ABI on the test classpath only (compileOnly does not reach
    // it), so OemApiUtilNegotiationTest can test the version negotiation.
    testImplementation libs.carui.plugin.apis

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.truth

    androidTestImplementation libs.hamcrest
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.truth
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.mockito.legacy
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    // This is needed to be able to spy certain classes with Mockito
    // Pinned with mockito.legacy: Mockito 5 under dexmaker-inline aborts ART.
    androidTestImplementation libs.dexmaker.mockito.inline
}
