// Library-level build file

apply plugin: 'com.android.library'
// Dart fork note: see car-ui-lib/car-ui-lib/build.gradle — the standalone 'jacoco' plugin
// conflicts with AGP 8's own JaCoCo wiring and breaks :testDebugUnitTest.

android {

    sourceSets {
        main {
            // Dart fork fix. res-overlayable/ is where AOSP keeps the <overlayable> declaration and
            // Soong knows the path; Gradle does not, so without this line the declaration compiles
            // to nothing and the module ships an OEM seam that is not there. Verified absent with
            // `aapt2 dump overlayable` before this was added.
            //
            // `+=` rather than `=`: the default src/main/res must survive.
            res.srcDirs += 'src/main/res-overlayable'
        }
    }
    // Dart fork note: AGP 9 rejects sharing car-ui-lib's namespace, so R/BuildConfig moved to
    // com.android.car.ui.rotary; Java packages are unchanged. Downstream consumers' R moves with
    // the manifest package (pinned in docs/api-surface/car-rotary-lib.txt; FORK.md covers Soong).
    namespace = 'com.android.car.ui.rotary'
    // Dart fork note: AGP 8 ignores the androidTest manifest's package, and androidTest sources
    // import com.android.car.rotary.test.R. assembleDebug does not build the test variant.
    testNamespace = 'com.android.car.rotary.test'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testApplicationId "com.android.car.rotary.test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Harmless alongside Robolectric (which supplies a real android runtime), and kept
            // consistent with every other module in the repo.
            returnDefaultValues = true
        }
        animationsDisabled = true
    }

    buildTypes {
        debug {
            // Dart fork note: testCoverageEnabled is deprecated in AGP 8; this is
            // the instrumented-coverage half that upstream actually wanted.
            enableAndroidTestCoverage = true
        }
    }

    project.gradle.taskGraph.whenReady {
        connectedDebugAndroidTest {
            ignoreFailures = true
        }
    }

    buildFeatures {
        buildConfig = false
    }

    // This is the gradle equivalent of the libs: ["android.car"] in the Android.bp
    useLibrary 'android.car'

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
}

dependencies {
    // Dart fork addition: a LOCAL test source set, which this module never had.
    //
    // DirectManipulationHelperTest was an instrumented test whose six cases were all red on device
    // with "SecurityException: Writable dex file ... is not allowed" — W^X rejecting the dex
    // dexmaker generates at runtime to build a mock. Two mocking configurations had already been
    // tried and neither worked (see the note that used to live below).
    //
    // The third option was not a third mocking library. The class under test is pure logic — it
    // reads a system service off a View's Context and sets tags on accessibility objects — so it
    // never needed a device. On the JVM under Robolectric, plain Mockito works, there is no dex
    // generation, and therefore no W^X to satisfy. The tests also now run in CI, which cannot run
    // instrumented tests at all.
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    // ApplicationProvider, for the one test that needs a real View.
    testImplementation libs.androidx.test.core

    // Dart fork note: declared so main compiles against the core its tests run on (it was 1.3.2
    // against 1.18.0). Found with scripts/dump-resolved-version.gradle.
    api libs.androidx.core
    api libs.androidx.annotation
    api libs.androidx.constraintlayout
    api libs.androidx.recyclerview

    // The tests use a CarUiRecyclerView
    androidTestImplementation project(':car-ui-lib')
    androidTestImplementation libs.hamcrest
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.truth
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
}
