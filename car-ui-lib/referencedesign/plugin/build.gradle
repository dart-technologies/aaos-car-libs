// Library-level build file

apply plugin: 'com.android.application'

android {
    sourceSets {
        main {
            // Dart fork addition (2026-08-20). res-overlayable/ holds the <overlayable> declaration
            // that says which of this plugin's resources an OEM RRO may replace. Gradle reads only
            // the directories it is told about, so without this line the declaration exists in
            // source and reaches no artifact -- which is exactly the defect docs/ARCHITECTURE.md
            // recorded for car-ui-lib itself.
            //
            // `+=`, not `=`: the default src/main/res must survive.
            res.srcDirs += 'src/main/res-overlayable'
        }
    }

    namespace = 'com.chassis.car.ui.plugin'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // In order to adb install a new version of an app over it's preinstalled version, the new
    // version must be signed with the same key as the preinstalled version. If you don't specify
    // a certificate in the Android.bp file, the default certificate that will
    // be used is build/target/product/security/testkey.{pk8,x509.pem}. Android studio doesn't
    // support signing apps using individual pk8 and x509.pem files, it requires a keystore file.
    signingConfigs {
        debug {
            storeFile file('chassis_upload_key.jks')
            storePassword 'chassis'
            keyAlias 'chassis'
            keyPassword 'chassis'
        }
    }

    useLibrary 'android.car'
}

dependencies {
    // Same artifact the library compiles against, so the two sides of the plugin boundary cannot
    // disagree about the interface shape — which is exactly how they disagreed before.
    implementation libs.carui.plugin.apis

    // Dart fork note: the plugin OEMs copy had no tests. Robolectric because every class here is
    // Android-coupled.
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockito.core
    testImplementation libs.truth
    testImplementation libs.androidx.test.core
    api libs.androidx.annotation
    api libs.androidx.appcompat
    api libs.androidx.constraintlayout
    api libs.androidx.preference
    api libs.androidx.recyclerview
    api libs.androidx.core
}
