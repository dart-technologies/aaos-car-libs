#
# Robolectric runs these at the module's targetSdkVersion (36, from settings.gradle's
# aaosTargetSDK), which is the default and is why no `sdk=` pin appears below.
#
# There used to be `sdk=NEWEST_SDK` here, with a comment explaining that Robolectric 4.14.1 shipped
# shadows only up to SDK 35 while the module targeted 36, so Robolectric would refuse to run
# ("Package targetSdkVersion=36 > maxSdkVersion=35") and the pin dropped the tests to 35 — meaning
# they did NOT exercise the targeted SDK. That was true, and 4.16.1 ends it: its highest shadow SDK
# is 36, equal to the target, so the refusal cannot occur and the pin selects the same 36 the
# default would.
#
# The pin is removed rather than left in place because it had become a trap pointing the wrong way.
# NEWEST_SDK means "newest Robolectric has", not "what this module targets". The day Robolectric
# adds SDK 37 while aaosTargetSDK stays 36, the pin would silently move every test in this module
# onto a platform the module does not target — the same class of error it was added to fix, in the
# opposite direction, and with nothing to notice it.
#
# NOTE: compileSdk is 37 and targetSdk is 36; these tests follow targetSdk. Robolectric does not
# read compileSdk at all, so a compileSdk bump alone never changes what runs here.
