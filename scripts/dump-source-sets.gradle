// Emits each Android module's effective main source configuration as Gradle resolves it, rather
// than parsing build files (srcDirs overrides, a parent-directory module, include/exclude filters).
//
//   ./gradlew -I ../scripts/dump-source-sets.gradle help -q
//
// Output, one field per line, tab-separated, prefixed so it survives being mixed with other output:
//   SRCSET<TAB>:project:path<TAB>srcDir<TAB>absolute/dir
//   FILTER<TAB>:project:path<TAB>include|exclude<TAB>pattern

gradle.projectsEvaluated { g ->
    // Printed at configuration time, so a configuration-cache hit would print nothing.
    g.rootProject.tasks.named('help') {
        it.notCompatibleWithConfigurationCache('dump-source-sets.gradle prints at configuration time')
    }

    g.rootProject.allprojects { p ->
        def android = p.extensions.findByName('android')
        if (android == null) return
        def main = android.sourceSets.findByName('main')
        if (main == null) return

        main.java.srcDirs.each { dir ->
            println "SRCSET\t${p.path}\t${dir}"
        }
        main.java.includes.each { pattern ->
            println "FILTER\t${p.path}\tinclude\t${pattern}"
        }
        main.java.excludes.each { pattern ->
            println "FILTER\t${p.path}\texclude\t${pattern}"
        }
    }
}
