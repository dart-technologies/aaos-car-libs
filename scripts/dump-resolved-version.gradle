// Prints the resolved version of a coordinate across every module, not the declared one: a bump
// below the transitive floor changes nothing, and only a repo-wide view of resolution shows it.
//
//   ./gradlew -I scripts/dump-resolved-version.gradle -PresolveCoord=androidx.core:core resolvedVersions -q
//
// Output: RESOLVED<TAB>:project<TAB>configuration<TAB>group:name<TAB>version

gradle.projectsEvaluated { g ->
    g.rootProject.allprojects { p ->
        p.tasks.register('resolvedVersions') {
            // Resolves configurations at execution time, which the configuration cache cannot store.
            notCompatibleWithConfigurationCache('resolves configurations through the Project at execution time')
            doLast {
                def filter = p.findProperty('resolveCoord')
                if (!filter) {
                    throw new GradleException('pass -PresolveCoord=group:name')
                }
                def (wantGroup, wantName) = filter.tokenize(':')
                // androidTest configurations too: tests can resolve another version (car-rotary-lib).
                ['debugCompileClasspath', 'debugRuntimeClasspath',
                 'debugAndroidTestCompileClasspath', 'debugAndroidTestRuntimeClasspath',
                 'debugUnitTestCompileClasspath'].each { cfgName ->
                    def cfg = p.configurations.findByName(cfgName)
                    if (cfg == null || !cfg.canBeResolved) return
                    try {
                        cfg.incoming.resolutionResult.allComponents.each { c ->
                            def id = c.moduleVersion
                            if (id != null && id.group == wantGroup && id.name == wantName) {
                                println "RESOLVED\t${p.path}\t${cfgName}\t${id.group}:${id.name}\t${id.version}"
                            }
                        }
                    } catch (Exception ignored) {
                        println "UNRESOLVED\t${p.path}\t${cfgName}\t${filter}\t<could-not-resolve>"
                    }
                }
            }
        }
    }
}
