// Resolves metalava's runtime classpath and writes it to a file for check-api-lint.py. The
// attributes are required: without them Guava's variants cannot be chosen, and the failure looks
// like a network problem.
//
//   ./gradlew -I ../scripts/metalava-resolver.gradle resolveMetalava -q

def METALAVA = 'com.android.tools.metalava:metalava:1.0.0-alpha15'

gradle.projectsEvaluated { g ->
    def root = g.rootProject
    def cfg = root.configurations.maybeCreate('dartMetalava')
    cfg.canBeConsumed = false
    cfg.canBeResolved = true
    cfg.attributes {
        attribute(Usage.USAGE_ATTRIBUTE, root.objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, root.objects.named(Category, Category.LIBRARY))
        attribute(Bundling.BUNDLING_ATTRIBUTE, root.objects.named(Bundling, Bundling.EXTERNAL))
        attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                  root.objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
    root.dependencies.add('dartMetalava', METALAVA)

    root.tasks.register('resolveMetalava') {
        // Same reason as resolvedVersions in dump-resolved-version.gradle.
        notCompatibleWithConfigurationCache('resolves a configuration through the Project at execution time')
        doLast {
            def out = new File(root.buildDir, 'metalava-classpath.txt')
            out.parentFile.mkdirs()
            out.text = cfg.files.join(':')
            println "METALAVA_CP_FILE=${out}"
        }
    }
}
