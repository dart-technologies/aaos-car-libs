# Dart fork note: distributionSha256Sum pins the distribution the wrapper downloads (from
# gradle.org/release-checksums, cross-checked with services.gradle.org). It is checked only on a
# fresh download. Update it with distributionUrl. `./gradlew wrapper` rewrites this file (re-add
# this note) and writes the running version's jar, so run it twice when changing versions.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=7aaba33a6aa7d03e0c7890869da1f1b5e1765c4d71db981a9d5db5cc47a10a6d
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-all.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
