    Per-display legality. Same moving vehicle as
    test_automotive_fully_restricted_prunes_to_glanceable_set, but the front
    passenger display is at BASELINE, so Video is legal there. Restrictions are
    a per-display concept, not a vehicle-wide one; a catalog that binds to
    vehicle state alone gets this wrong and needlessly blanks the passenger
    screen.
