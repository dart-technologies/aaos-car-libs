- name: test_automotive_surface_repruned_for_destination_display
  description: >-
    A surface composed on the passenger display at BASELINE -- with Video and a
    full List -- and then sent to the DRIVER display must be re-pruned for its
    destination, not rendered with the restrictions it was composed under. The
    target display's restrictions always win. Getting this wrong turns a
    share-to-driver feature into a distraction delivery mechanism.
  catalog: *automotive_catalog
  action: prune
  args:
    allowed_components: [Text, Icon, Row, Column, Divider, Button]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
      components:
        Text: {}
        Icon: {}
        Row: {}
        Column: {}
        Divider: {}
        Button: {}

