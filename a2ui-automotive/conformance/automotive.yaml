# ---------------------------------------------------------------------------
# Automotive driver-distraction conformance suite.
#
# Each AAOS restriction level (android.car.drivingstate.CarUxRestrictions) is
# one `action: prune` case against the v1.0 basic catalog's 18 components.
# Constants are the platform values, read from android.car.jar (API 34) with
# javap -constants; FULLY_RESTRICTED is a composite of the nine bits:
#
#   UX_RESTRICTIONS_BASELINE                 0x0
#   UX_RESTRICTIONS_NO_DIALPAD               0x1
#   UX_RESTRICTIONS_NO_FILTERING             0x2
#   UX_RESTRICTIONS_LIMIT_STRING_LENGTH      0x4
#   UX_RESTRICTIONS_NO_KEYBOARD              0x8
#   UX_RESTRICTIONS_NO_VIDEO                 0x10
#   UX_RESTRICTIONS_LIMIT_CONTENT            0x20
#   UX_RESTRICTIONS_NO_SETUP                 0x40
#   UX_RESTRICTIONS_NO_TEXT_MESSAGE          0x80
#   UX_RESTRICTIONS_NO_VOICE_TRANSCRIPTION   0x100
#   UX_RESTRICTIONS_FULLY_RESTRICTED         0x1ff   <- composite
#
# Scope note 1: `prune` constrains which components appear, not values (list
# length, string length, nesting depth). See README.md.
#
# Scope note 2: each case states its restriction level as an input, with no
# provenance, so a renderer deriving allowed_components from a stale or
# never-delivered reading still conforms. Provenance (delivered /
# never-delivered / disconnected) is the renderer's job; see car-uxr-flutter's
# RestrictionsSource.
#
# These are the first v1.0 prune cases; upstream has 0.8 and 0.9 only.
# ---------------------------------------------------------------------------

- name: test_automotive_baseline_allows_full_catalog
  description: >-
    UX_RESTRICTIONS_BASELINE (0x0). Vehicle parked, or a display with no
    restrictions applied. Nothing is pruned.
  catalog: &automotive_catalog
    version: "1.0"
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Image"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Video"
            - $ref: "#/components/AudioPlayer"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/List"
            - $ref: "#/components/Card"
            - $ref: "#/components/Tabs"
            - $ref: "#/components/Modal"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
            - $ref: "#/components/TextField"
            - $ref: "#/components/CheckBox"
            - $ref: "#/components/ChoicePicker"
            - $ref: "#/components/Slider"
            - $ref: "#/components/DateTimeInput"
      components:
        Text: {}
        Image: {}
        Icon: {}
        Video: {}
        AudioPlayer: {}
        Row: {}
        Column: {}
        List: {}
        Card: {}
        Tabs: {}
        Modal: {}
        Divider: {}
        Button: {}
        TextField: {}
        CheckBox: {}
        ChoicePicker: {}
        Slider: {}
        DateTimeInput: {}
  action: prune
  args:
    allowed_components:
      [Text, Image, Icon, Video, AudioPlayer, Row, Column, List, Card, Tabs,
       Modal, Divider, Button, TextField, CheckBox, ChoicePicker, Slider,
       DateTimeInput]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Image"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Video"
            - $ref: "#/components/AudioPlayer"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/List"
            - $ref: "#/components/Card"
            - $ref: "#/components/Tabs"
            - $ref: "#/components/Modal"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
            - $ref: "#/components/TextField"
            - $ref: "#/components/CheckBox"
            - $ref: "#/components/ChoicePicker"
            - $ref: "#/components/Slider"
            - $ref: "#/components/DateTimeInput"
      components:
        Text: {}
        Image: {}
        Icon: {}
        Video: {}
        AudioPlayer: {}
        Row: {}
        Column: {}
        List: {}
        Card: {}
        Tabs: {}
        Modal: {}
        Divider: {}
        Button: {}
        TextField: {}
        CheckBox: {}
        ChoicePicker: {}
        Slider: {}
