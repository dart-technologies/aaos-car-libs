- name: test_automotive_out_of_catalog_component_is_not_reintroduced
  description: >-
    An agent will eventually propose a component the restriction level does not
    permit. Pruning is the enforcement boundary: asking for Video on a
    FULLY_RESTRICTED surface must not reintroduce it. Requesting a component
    that is not in the pruned set yields the pruned set, never a superset.
  catalog: *automotive_catalog
  action: prune
  args:
    allowed_components: [Text, Icon, Row, Column, Divider, Button]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
      components:
        Text: {}
        Icon: {}
        Row: {}
        Column: {}
        Divider: {}
        Button: {}
