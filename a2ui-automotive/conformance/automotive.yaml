- name: test_automotive_limit_content_drops_deep_navigation
  description: >-
    UX_RESTRICTIONS_LIMIT_CONTENT (0x20). Caps how much can be presented. The
    component-level half is expressible: Tabs and Modal introduce navigable
    depth, and Video is unbounded-duration content, so all three are pruned.
    The VALUE half -- getMaxCumulativeContentItems() capping List length -- is
    NOT expressible with `prune`; see README.md.
  catalog: *automotive_catalog
  action: prune
  args:
    allowed_components:
      [Text, Image, Icon, AudioPlayer, Row, Column, List, Card, Divider,
       Button, TextField, CheckBox, ChoicePicker, Slider, DateTimeInput]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Image"
            - $ref: "#/components/Icon"
            - $ref: "#/components/AudioPlayer"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/List"
            - $ref: "#/components/Card"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
            - $ref: "#/components/TextField"
            - $ref: "#/components/CheckBox"
            - $ref: "#/components/ChoicePicker"
            - $ref: "#/components/Slider"
            - $ref: "#/components/DateTimeInput"
      components:
        Text: {}
        Image: {}
        Icon: {}
        AudioPlayer: {}
        Row: {}
        Column: {}
