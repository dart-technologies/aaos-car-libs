- name: test_automotive_fully_restricted_prunes_to_glanceable_set
  description: >-
    UX_RESTRICTIONS_FULLY_RESTRICTED (0x1ff). Moving vehicle, driver display.
    Prunes to the minimal glanceable set: text, a label icon, one-tap actions,
    and the layout primitives needed to arrange them. No media, no lists, no
    input, no navigable depth. This is the composite of all nine restriction
    bits, so it is a superset of every case above -- never test it by equality
    on the whole restrictions field.
  catalog: *automotive_catalog
  action: prune
  args:
    allowed_components: [Text, Icon, Row, Column, Divider, Button]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
      components:
        Text: {}
        Icon: {}
        Row: {}
        Column: {}
        Divider: {}
        Button: {}

- name: test_automotive_driving_state_unknown_fails_closed
  description: >-
    DRIVING_STATE_UNKNOWN. The platform treats an unknown driving state exactly
    like MOVING, and a renderer that has never received a restriction event must
    fail CLOSED. A default-false boolean is byte-identical to a genuine "parked"
    reading, so absence of signal must prune to the same set as
    FULLY_RESTRICTED, not to BASELINE. This is the case that catches broken
    implementations.
  catalog: *automotive_catalog
  action: prune
  args:
    allowed_components: [Text, Icon, Row, Column, Divider, Button]
  expect:
    catalogSchema:
      catalogId: automotive
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
            - $ref: "#/components/Icon"
            - $ref: "#/components/Row"
            - $ref: "#/components/Column"
            - $ref: "#/components/Divider"
            - $ref: "#/components/Button"
      components:
        Text: {}
        Icon: {}
        Row: {}
        Column: {}
        Divider: {}
        Button: {}

- name: test_automotive_passenger_display_unrestricted_while_moving
