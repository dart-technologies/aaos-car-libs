// Library-level build file

apply plugin: 'com.android.library'

android {
    namespace = 'com.android.car.uxr'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        // Dart fork note: test roots are siblings of 'src', never children, or they would compile
        // as main source and ship in the AAR.
        test {
            java.srcDirs = ['tests/unit/src']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Deliberately NOT returnDefaultValues: a silently-stubbed android.jar method
            // returning 0/false is the "absence indistinguishable from a benign reading" shape
            // these tests exist to detect. Tests mock or pass null instead.
            returnDefaultValues = false
        }
    }

    useLibrary 'android.car'
}

dependencies {
    implementation libs.androidx.lifecycle.common.java8

    implementation libs.androidx.recyclerview

    implementation project(":car-ui-lib")

    testImplementation libs.junit
    testImplementation libs.mockito.core
}
