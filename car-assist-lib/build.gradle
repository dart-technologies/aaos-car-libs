apply plugin: 'com.android.library'

android {
    namespace = 'com.android.car.assist'
    compileSdk = gradle.ext.aaosLatestSDK

    defaultConfig {
        minSdk = 28
        targetSdk = gradle.ext.aaosTargetSDK
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
        // Dart fork note: tests live outside 'src', or they would compile as main source.
        test {
            java.srcDirs = ['tests/unit/src']
            resources.srcDirs = ['tests/unit/config']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = false
        }
    }
}

dependencies {
    // Dart fork note: androidx.legacy:legacy-support-v4 removed. It shipped no code and pulled in
    // androidx.media 1.0.0; a javap scan found no reference to anything it supplied. See FORK.md.
    implementation libs.androidx.annotation
    implementation libs.androidx.core
    implementation project(path: ':car-messenger-common:model')
}

// Dart fork note: car-messenger-common depends on this module, which had no tests. Robolectric
// because the payload handlers read real Notification/Bundle structures.
dependencies {
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockito.core
    testImplementation libs.truth
    testImplementation libs.androidx.test.core
}
